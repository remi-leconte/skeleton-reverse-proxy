services:
  reverse-proxy:
    image: nginx:1.31.3-alpine3.24
    container_name: reverse_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - global_proxy_network

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_logs:/var/log/letsencrypt
      - certbot_lib:/var/lib/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while true; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - global_proxy_network

networks:
  global_proxy_network:
    name: global_proxy_network

volumes:
  certbot_conf:
  certbot_logs:
  certbot_lib:


