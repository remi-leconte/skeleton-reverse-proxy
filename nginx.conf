events {}

http {
    # Redirection globale HTTP vers HTTPS (Port 80 -> 443)
    server {
        listen 80;
        listen [::]:80;
        server_name projet.tld www.projet.tld api.projet.tld staging.projet.tld api-staging.projet.tld;

        # Endpoint pour le renouvellement auto par Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirection automatique vers HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Application Front (projet.tld) - HTTPS Prod
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name projet.tld www.projet.tld;

        ssl_certificate /etc/letsencrypt/live/projet.tld/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/projet.tld/privkey.pem;

        location / {
            proxy_pass http://projet_front_prod-front-1:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Application API (api.projet.tld) - HTTPS Prod
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.projet.tld;

        # Domaines regroupés sous un certificat principal projet.tld (à améliorer)
        ssl_certificate /etc/letsencrypt/live/projet.tld/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/projet.tld/privkey.pem;

        location / {
            proxy_pass http://projet_api_prod-nginx-1:80;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Application Front Staging (staging.projet.tld) - HTTPS Staging
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name staging.projet.tld;

        # Domaines regroupés sous un certificat principal projet.tld
        ssl_certificate /etc/letsencrypt/live/projet.tld/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/projet.tld/privkey.pem;

        auth_basic "Acces Restreint Staging";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://projet_front_staging-front-1:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Application API Staging (api-staging.projet.tld) - HTTPS Staging
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api-staging.projet.tld;

        # Domaines regroupés sous un certificat principal projet.tld
        ssl_certificate /etc/letsencrypt/live/projet.tld/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/projet.tld/privkey.pem;

        # Gestion de la Basic Auth
        set $auth "Acces Restreint Staging API";

        # Exemption pour le preflight OPTIONS (CORS)
        if ($request_method = OPTIONS) {
            set $auth "off";
        }

        # Exemption si le header personnalisé X-Staging-Auth est présent et valide
        if ($http_x_staging_auth = "Basic LOGIN:PASSWORD_BASE64") {
            set $auth "off";
        }

        # Exemption pour les fichiers du dossier upload
        if ($request_uri ~* "^/upload/") {
            set $auth "off";
        }

        auth_basic $auth;
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://projet_api_staging-nginx-1:80;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }
    }
}
